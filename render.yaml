services:
  - type: web
    name: marketplace-usc-pagos-staging
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    # STAGING usa exclusivamente pagos_test; nunca public.payment_transactions.
    startCommand: npm run start:supabase:test
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_JWT_REQUIRED
        value: "true"
      - key: AUTH_JWT_ISSUER
        value: https://xmrlazemifmepyahqsrz.supabase.co/auth/v1
      - key: AUTH_JWT_AUDIENCE
        # Bloqueo temporal: no corresponde a la audiencia oficial de Login.
        value: staging-blocked-audience-not-official
      - key: AUTH_JWT_JWKS_URL
        value: https://xmrlazemifmepyahqsrz.supabase.co/auth/v1/.well-known/jwks.json
      - key: ORDERS_INTEGRATION_ENABLED
        value: "true"
      - key: ORDERS_BASE_URL
        value: https://ordenes-thaliana.onrender.com
      - key: INTEGRATION_OUTBOX_ENABLED
        value: "true"
      # Las escrituras reales siguen bloqueadas hasta una prueba coordinada y autorizada.
      - key: PAYMENT_INTEGRATIONS_WRITE_ENABLED
        value: "false"
      - key: ORDERS_APPROVED_STATUS
        value: CONFIRMADA
      - key: ACCOUNTING_BASE_URL
        value: https://marketplace-usc-contabilidad.onrender.com
      - key: NOTIFICATIONS_BASE_URL
        value: https://marketplace-usc-notificaciones.onrender.com
      - key: INVENTORY_BASE_URL
        value: https://marketplace-equipo4.onrender.com
      - key: TRACKING_BASE_URL
        value: https://marketplace-usc-seguimiento.onrender.com
      - key: INVENTORY_CONFIRMATION_BY_PAYMENTS
        value: "false"
      # Deben cargarse en Render como secretos; no van en Git.
      - key: SUPABASE_PGHOST
        sync: false
      - key: SUPABASE_PGPORT
        sync: false
      - key: SUPABASE_PGDATABASE
        sync: false
      - key: SUPABASE_PGUSER
        sync: false
      - key: SUPABASE_PGPASSWORD
        sync: false
      - key: SUPABASE_PGSSLROOTCERT_CONTENT
        sync: false
      - key: SUPABASE_PGSCHEMA
        value: pagos_test
      # Origen único del frontend integrado. Sin valor no se habilita CORS.
      - key: CORS_ALLOWED_ORIGIN
        sync: false
